name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "native/android/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build installable debug APK
        run: gradle -p native/android assembleDebug --console=plain

      - name: Prepare artifact
        run: |
          mkdir -p outputs
          cp native/android/app/build/outputs/apk/debug/app-debug.apk outputs/QR-Menu-EC-0.8.1-debug.apk
          sha256sum outputs/QR-Menu-EC-0.8.1-debug.apk | tee outputs/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QR-Menu-EC-0.8.1-debug-not-production
          path: |
            outputs/QR-Menu-EC-0.8.1-debug.apk
            outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
